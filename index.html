<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IG RATE NI ZHAO</title>

<style>
body{
  background:#050b18;
  color:#00ccff;
  font-family:sans-serif;
  text-align:center;
}

h1{
  text-shadow:0 0 20px #00ccff;
}

.card{
  margin:20px;
  padding:20px;
  border:1px solid #00ccff;
  border-radius:15px;
  box-shadow:0 0 20px #00ccff33;
}

input{
  width:80%;
  padding:12px;
  margin:8px;
  border-radius:10px;
  border:1px solid #00ccff;
  background:#0a142a;
  color:#00ccff;
}

button{
  padding:12px 25px;
  background:#00ccff;
  border:none;
  color:black;
  font-weight:bold;
  border-radius:10px;
  cursor:pointer;
  box-shadow:0 0 15px #00ccff;
}

#loading{
  display:none;
  margin-top:10px;
  color:#00ccff;
  animation:blink 1s infinite;
}

@keyframes blink{
  50%{opacity:0.3;}
}

#result{
  margin-top:20px;
  white-space:pre-line;
}
</style>
</head>

<body>

<h1>🔥 IG RATE NI ZHAO</h1>

<div class="card">

<input id="followers" placeholder="Followers">
<input id="following" placeholder="Following">
<input id="posts" placeholder="Posts">

<button onclick="rate()">RATE NOW</button>

<div id="loading">⏳ Analyzing account...</div>

<div id="result"></div>

</div>

<script>
async function rate(){

  loading.style.display="block";
  result.innerText="";

  let res = await fetch("/.netlify/functions/ai",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      followers: Number(followers.value),
      following: Number(following.value),
      posts: Number(posts.value)
    })
  });

  let data = await res.json();

  loading.style.display="none";
  result.innerText = data.reply;
}
</script>

</body>
</html>
