<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IG Rate System</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0f1a;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.card{
  width:340px;
  padding:20px;
  background:#111827;
  border-radius:15px;
  box-shadow:0 0 20px #00f2ff55;
}

input, select{
  width:100%;
  margin:8px 0;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#1f2937;
  color:white;
}

button{
  width:100%;
  padding:10px;
  background:#00f2ff;
  border:none;
  font-weight:bold;
  cursor:pointer;
  margin-top:10px;
}

.bar-container{
  width:100%;
  height:15px;
  background:#222;
  border-radius:10px;
  margin-top:10px;
  overflow:hidden;
}

#bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#00f2ff,#00ff88);
  transition:1s;
}

.result{
  margin-top:10px;
  font-size:14px;
}
</style>
</head>

<body>

<div class="card">
  <h2>🔥 IG RATE SYSTEM</h2>

  <input id="followers" placeholder="Followers">
  <input id="following" placeholder="Following">
  <input id="posts" placeholder="Posts">

  <select id="mode">
    <option value="pro">Pro Mode</option>
    <option value="roast">Roast Mode</option>
    <option value="sigma">Sigma Mode</option>
  </select>

  <button onclick="rate()">RATE NOW</button>

  <div class="bar-container">
    <div id="bar"></div>
  </div>

  <div class="result" id="result"></div>
</div>

<script>
function calculateScore(followers, following, posts){
  let engagement = followers / (following + 1);
  let activity = Math.min(posts * 2, 100);

  let score = (engagement * 60) + (activity * 0.4);

  if(score > 100) score = 100;
  if(score < 0) score = 10;

  return Math.round(score);
}

function animateBar(score){
  document.getElementById("bar").style.width = score + "%";
}

function generateModeText(score, mode){

  if(mode === "roast"){
    if(score < 40) return "Bro… delete IG na 💀";
    if(score < 70) return "Mid account energy 😭";
    return "Okay ka pero hindi pa legend 🔥";
  }

  if(mode === "sigma"){
    if(score < 40) return "Silent grind 🗿";
    if(score < 70) return "Unknown presence 🗿";
    return "SIGMA MODE ACTIVATED 🗿🔥";
  }

  if(mode === "pro"){
    if(score < 40) return "Low engagement 📉";
    if(score < 70) return "Decent growth 📊";
    return "Strong account 🚀";
  }
}

function save(data){
  let history = JSON.parse(localStorage.getItem("ig")) || [];
  history.push(data);
  localStorage.setItem("ig", JSON.stringify(history));
}

function rate(){
  let followers = +document.getElementById("followers").value;
  let following = +document.getElementById("following").value;
  let posts = +document.getElementById("posts").value;
  let mode = document.getElementById("mode").value;

  let score = calculateScore(followers, following, posts);

  animateBar(score);

  let result = {
    rating: score + "/100",
    percent: score + "%",
    explanation: generateModeText(score, mode)
  };

  save(result);

  document.getElementById("result").innerHTML =
    "⭐ " + result.rating + "<br>" +
    "📊 " + result.percent + "<br>" +
    "🧠 " + result.explanation;
}
</script>

</body>
</html>
